{% extends "base.html" %}
{% block title %}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<p>{{ text }}</p>
<ul>
    {% for item in items %}
    <a href="{{ url_for('items.item_page', item_id=item.id) }}">{{ item.name }} - {{ item.price }} ₽ - {{ item.size
        }}</a>
    {% endfor %}
</ul>
{% endblock %}
