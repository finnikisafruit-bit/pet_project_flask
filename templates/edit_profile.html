{% extends "base.html" %}
{% block title %}Редактировать профиль{% endblock %}
{% block content %}
<h1>Редактировать профиль</h1>
<form method="POST">
    <input name='username' value="{{ current_user.username }}" required>
    <input name="email" type="email" value="{{ current_user.email }}" required>
    <input name="password" type="password" placeholder="Новый пароль (необязательно)">
    <button type="submit">Сохранить</button>
</form>
<a href="/profile">Отмена</a>
{% endblock %}
